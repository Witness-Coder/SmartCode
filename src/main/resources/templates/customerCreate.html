<html>
	<head>
		<title>SmartCode</title>
		<link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
		<link rel="stylesheet" th:href="@{/bootstrap-icons-1.11.3/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css}">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	</head>
	
	<body>
		<div class="d-flex">
			<div >
				<image style="height: 100%;" th:src="@{/images/pic8.PNG}"></image>
			</div>
			<div style="margin-left: 150px;">
				<div>
					<h2 style="color:rgb(255, 0, 255); margin-top: px;">CREATE NEW ACCOUNT</h2>
					<img th:src="@{/images/pic7.PNG}">
				</div>
				<form  action="/registers" method="post" enctype="multipart/form-data">
				    <!-- Full Name -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="Name" class="form-label">Full Name</label>
				        <input style="color:rgb(64, 0, 128);" name="name" type="text" class="form-control" id="Name" placeholder="Enter full name" required />
				    </div>

				    <!-- Email -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="Email" class="form-label">Email</label>
				        <input style="color:rgb(64, 0, 128);" name="email" type="email" class="form-control" id="email" placeholder="Enter valid email" required />
				    </div>

				    <!-- Address -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="Address" class="form-label">Address</label>
				        <input style="color:rgb(64, 0, 128);" name="Address" type="text" class="form-control" id="Address" placeholder="Enter Address eg Mwanza-Ukerewe" required />
				    </div>

				    <!-- Phone Number -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="PhoneNumber" class="form-label">Phone Number</label>
				        <input style="color:rgb(64, 0, 128);" name="PhoneNumber" type="text" class="form-control" id="PhoneNumber" placeholder="Enter valid phone number eg +225754842480" required />
				    </div>

				    <!-- Password -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="Password" class="form-label">Password</label>
				        <input style="color:rgb(64, 0, 128);" name="Password" type="password" class="form-control" id="Password" placeholder="Enter Strong Password" required />
				    </div>

				    <!-- Profile Photo -->
				    <div class="mb-3">
				        <label style="color:rgb(255, 0, 255);" for="imageFile" class="form-label">Customer Photo</label>
				        <input style="color:rgb(64, 0, 128);" name="imageFile" type="file" accept="image/*" class="form-control" id="ProfilePhoto" required />
				    </div>

					
					
				    <!-- Submit Button -->
				    <button type="submit" class="btn btn-primary">Submit</button>
					
				    
				    <!-- Message Display -->
				    <p style="color: rgb(128, 0, 255);" th:text="${message}" class="mt-3"></p>
				</form>
				<div class="d-flex  text-center">
				 	<a  href="/login">
				   		<button class="btn btn-outline-primary me-2">LOGIN</button>
				 	</a>
				 	<a href="/">
						<button class="btn btn-dark">HOME</button>
				 	</a>
				</div>
		  	</div>
		</div>
				
	</body>
</html>
