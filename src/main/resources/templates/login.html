<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
	<link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/bootstrap-icons-1.11.3/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
	
		<div class="d-flex">
				<div >
					<image style="height: 100%;" th:src="@{/images/pic8.PNG}"></image>
				</div>
				<div style="margin-left: 100px;">
					<div>
						<h2 style="color:rgb(255, 0, 255); margin-top: px;">Wellcome! Login into Account</h2>
						<img th:src="@{/images/pic7.PNG}">
					</div>
					<div class="container mt-5">
					    <h2 style="color:rgb(255, 0, 255);" class="text-center">Login</h2><br><br>
						<p th:if="${error}" th:text="${error}" class="alert alert-danger"></p><br><br>
					    <form method="post" action="/customerAuth" class="needs-validation" novalidate>
					        
					        <div class="mb-3">
					            <label style="color:rgb(255, 0, 255);" for="email" class="form-label">Email:</label>
					            <input style="color:rgb(0, 0, 128);" type="email" name="email" class="form-control" id="email" required />
					        </div>

					        
					        <div class="mb-3">
					            <label style="color:rgb(255, 0, 255);" for="password" class="form-label">Password:</label>
					            <input style="color:rgb(0, 0, 128);" type="password" name="password" class="form-control" id="password" required />
					        </div>

					        
					        <p th:text="${error}" class="text-danger" style="display: none;"></p>

					        
					        <button type="submit" class="btn btn-primary w-100">Login</button>
					    </form>

					    <div class="mt-3 text-center">
					        <a href="/register">Don't have an account? Create a new one</a><br>
					        <a style="color: red;" href="/forgot-pass">Forgot Password?</a>
					    </div>
					</div>
					<div class="d-flex  text-center">
						
						
					 
					 	<a href="/">
							<button class="btn btn-dark">HOME</button>
					 	</a>
					</div>
			  </div>
		</div>
</body>
</html>
