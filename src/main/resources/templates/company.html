<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lady T SmartCode</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.11.3/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/mycss.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Hamburger -->
<div class="hamburger" onclick="toggleSidebar()">
    <i style="color: black;" class="bi bi-list"></i>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div style="position: relative; width: 50px; height: 50px; cursor: pointer; margin-left: 20px;">
        <img id="managerPic"
             style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;"
             th:src="@{'/manager/image/' + ${session.loggedInUserId}}"
             alt="Profile"
             onclick="openManagerProfileModal()"
             onerror="this.onerror=null; this.src='/images/default.PNG';"/>
    </div>
    <h6 style="color: white;" th:text="${session.loggedInUser}"></h6>
    <a class="sidebar-a" href="#"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
    <a class="sidebar-a" href="#"><i class="bi bi-chat me-2"></i> Chats</a>
    <a class="sidebar-a" href="/logout"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
</div>

<!-- Main Content -->
<div class="main-content text-center" style="padding-top: 50px;">
    <h1 style="color: rgb(255, 0, 255);">Lady T SmartCode Company</h1>
    <img class="logo" src="/images/logo.jpg">
    <div>
        <h3>Welcome <span style="color: blueviolet;" th:text="${session.loggedInUser}"></span> of SmartCode Company 😊😊!!</h3>
    </div>
    <a class="btn btn-primary" href="/productlist">Product List</a>
    <a class="btn btn-primary" href="/userlist">User List</a>
</div>

<!-- Editing Modal -->
<div id="managerProfileModal" class="popup">
    <div >

        <span class="close" onclick="closeManagerProfileModal()">&times;</span>

        <!-- Profile Image -->
        <div class="profile-image-container" >
            <img id="modalManagerPic"
                 alt="Profile"
                 onclick="openFullSizeModal()"
                 onerror="this.onerror=null; this.src='/images/default.PNG';"/>

            <i class="bi bi-camera-fill camera-icon"
               onclick="document.getElementById('managerModalImageInput').click()"></i>

            <input type="file"
                   id="managerModalImageInput"
                   accept="image/*"
                   style="display:none;"
                   onchange="uploadManagerProfileImage(this)"/>
        </div>

        <hr>

        <!-- Clickable Name (NOT editable here) -->
        <div id="managerNameDisplay"
             class="name-display"
             onclick="openEditNameModal()"
             th:text="${session.loggedInUser}">
        </div>

    </div>
</div>

<!-- Full-size Modal -->
<div id="fullSizeProfileModal" class="popup">
    <div class="popup-content-wrapper" style="width:80%; max-width:500px;">
        <span class="close" onclick="closeFullSizeModal()">&times;</span>
        <div class="fullsize-image-container">
            <img id="fullSizeProfilePic" class="popup-content" onclick="document.getElementById('fullSizeImageInput').click()" onerror="this.onerror=null; this.src='/images/default.PNG';"/>
            <i class="bi bi-camera-fill fullsize-camera-icon" onclick="document.getElementById('fullSizeImageInput').click()"></i>
            <input type="file" id="fullSizeImageInput" accept="image/*" style="display:none;" onchange="uploadFullSizeProfileImage(this)"/>
        </div>
    </div>
</div>


<!--Editing name-->
<div class="modal fade" id="editNameModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title text-primary">
                    <i class="bi bi-pencil-square me-2"></i>
                    Enter New Name
                </h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body text-center">
                <input type="text"
                       id="editNameInput"
                       class="form-control text-center fw-bold"
                       placeholder="Enter new name">
            </div>

            <div class="modal-footer justify-content-center">
                <button class="btn btn-secondary"
                        onclick="cancelEditName()">
                    Cancel
                </button>

                <button class="btn btn-primary"
                        onclick="confirmEditName()">
                    OK
                </button>
            </div>

        </div>
    </div>
</div>

<script th:src="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/smartjs.js}"></script>

</body>
</html>
