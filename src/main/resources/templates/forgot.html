<!DOCTYPE html>
<html>
	<head>
		<title>forgot-pass</title>
		<link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
		<link rel="stylesheet" th:href="@{/bootstrap-icons-1.11.3/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css}">
	</head>
	<body>
		<div class="alert alert-success" th:if="${messageemail}" th:text="${messageemail}"></div>
		<div class="alert alert-danger" th:if="${erroremail}" th:text="${erroremail}"></div>
		<form method="post" action="/forgot-pass">
			<div class="mb-3">
			<label class="form-label">Email</label>
			<input class="form-control" name="email" type="email" placeholder="Insert email you registered with">
			<button class="btn btn-primary" type="submit">Request resert token</button>
		</form>
	</body>
</html>
