<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SmartCode</title>
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-icons-1.11.3/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css}">
	<link rel="stylesheet" th:href="@{/css/mycss.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">	
</head>
<body>
	<div class="hamburger" onclick="toggleSidebar()">
	    <i style="color: black;" class="bi bi-list"></i> <!-- Bootstrap icon -->
	</div>

	
	<div  class="sidebar" id="sidebar">
		<a href="#">
			<img th:src="@{'/customer/image/' + ${session.loggedInUserId}}" 
			     alt="Profile" 
				 onerror="this.onerror=null; this.src='/images/default.PNG';" 
			    style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;" />
		</a>
		<h6  style="color: white; padding-left: 35px;" th:text="${session.loggedInUser}"></h6>
		
		<a class="sidebar-a" style="color: rgb(0, 255, 128); width: 148px;"  href="#"><i class="bi bi-speedometer2">Dashboard</i></a>
		
		<a class="sidebar-a" href="#" ><i class="bi bi-chat"></i> chats</a>
		<a class="sidebar-a" href="/logout" ><i class="bi bi-box-arrow-right"></i> Logout</a>
					
	</div>
	

	<div class="navbar-nav d-flex navbar-expand-lg">
    	<div class="nav-item d-flex navbar-expand-lg bg-dark">       		
			<div class="position-absolute top-0 end-0 mt-3 me-3">
        		<form method="get" action="/userlist" class="d-flex mb-3">
            		<input style="width: 250px; height:50px; margin-top: 10px;" type="text" name="keyword" class="form-control me-2" placeholder="Search user by name..." />
            		<button style="width: 60px; height:50px; margin-top: 10px;" type="submit" class="btn btn-primary">
                		<i class="bi bi-search"></i> Search
            		</button>
        		</form>
			</div>        
    	</div>
	</div>
	<div >
		<img style="margin-left: 400px;" class="text-center" th:src="@{/images/pic7.PNG}">
	</div>

	<h2 style="color: rgb(255, 0, 255);" class="text-center">Welcome, <span th:text="${session.loggedInUser}"></span>!</h2>





	<div class="table-responsive">
			<a href="/manager/company" class="btn btn-outline-dark">Back</a>
    		<table class="table table-striped table-bordered">
        		<thead class="table-dark">
            		<tr>
                		<th>User Name</th>
                		<th>Email</th>
                		<th>Address</th>
                		<th>Phone</th>				
                		<th>Reg Date</th>				
                		<th>Photo</th>
				        <th>Action</th>
            		</tr>
        		</thead>
        		<tbody>
            		<tr th:each="c: ${dList}">
                		<td th:text="${c.name}"></td>
                		<td th:text="${c.email}"></td>
                		<td th:text="${c.address}"></td>
                		<td th:text="${c.PhoneNumber}"></td>				
                		<td th:text="${c.RegDate}"></td>
                		<td>                   
                    		<button type="button" class="btn btn-info btn-sm" 
                            	data-bs-toggle="modal" 
                            	th:attr="data-bs-target='#imageModal__' + ${c.id}">
                        		View Image
                    		</button>
                		</td>
                		<td>                    
                    		<a th:href="@{/deleting(id=${c.id})}" class="btn btn-danger btn-sm"
                       			onclick="return confirm('Are you sure you want to delete?')">Delete
							</a>
                		</td>
           			</tr>
        		</tbody>
    		</table>
	</div>


	<div th:each="c: ${dList}">
    	<div class="modal fade" th:id="'imageModal__' + ${c.id}" tabindex="-1" aria-hidden="true">
       	 	<div class="modal-dialog modal-dialog-centered" style="max-width: 370px;">
            	<div class="modal-content">
                	<div class="modal-header">
                    	<h5 class="modal-title">User Photo</h5>
                    	<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                	</div>
                	<div class="modal-body text-center">
                    	<img th:src="@{'/customer/image/' + ${c.id}}" class="img-fluid" style="width: 350px; height: 350px;" alt="user Image"/>
                	</div>
            	</div>
        	</div>
    	</div>
	</div>

	        
	<script th:src="@{/bootstrap-5.3.3-dist/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js}"></script>
	<script th:src="@{/js/smartjs.js}"></script>


</body>
</html>
